name: 마법공식 검색

on:
  schedule:
    # 시간은 UTC 기준 (KST = UTC+9). GitHub 예약 실행은 수 분~수십 분 늦게 시작될 수 있습니다.
    - cron: "8 7 * * 1-5"    # 16:08 KST — 장 마감 후
  workflow_dispatch:         # GitHub 앱/웹에서 수동 실행 버튼
    inputs:
      cf_minutes:
        description: "현금흐름표(FCF) 수집 최대 시간 (분)"
        default: "45"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: magic
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      - name: 이전 일봉·재무 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 검색 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CF_MINUTES: ${{ github.event.inputs.cf_minutes || '45' }}   # 현금흐름표(FCF) 수집 최대 시간 (분)
        run: |
          set -o pipefail
          python -u engine/build.py 2>&1 | while IFS= read -r l; do echo "$(TZ=Asia/Seoul date +%H:%M:%S) $l"; done | tee run.log

      - name: 미국 검색 실행 (실패해도 국내 결과는 배포)
        continue-on-error: true
        env:
          US_MINUTES: "40"         # SEC 재무 수집 최대 시간 (분)
        run: |
          set -o pipefail
          python -u engine/us.py 2>&1 | while IFS= read -r l; do echo "$(TZ=Asia/Seoul date +%H:%M:%S) $l"; done | tee us.log || true
          # 실패한 날은 지난번 결과를 그대로 씀
          if [ ! -f site/data/us.json ] && [ -f cache/us.json ]; then cp cache/us.json site/data/us.json; echo "미국: 지난 결과 사용"; fi
          if [ -f site/data/us.json ]; then mkdir -p cache && cp site/data/us.json cache/us.json; fi

      - name: 실행 기록을 run-output 브랜치에 저장 (점검용, 매번 덮어씀)
        if: always()
        run: |
          mkdir -p out && cp run.log out/ 2>/dev/null || true
          cp site/data/mf.json out/ 2>/dev/null || true
          cp us.log site/data/us.json out/ 2>/dev/null || true
          cd out
          git init -q -b run-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "실행 기록 $(date -u +%FT%TZ)" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" run-output

      - name: 일봉·재무 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: data-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
