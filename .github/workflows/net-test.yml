name: 접속 점검 (수동)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests yfinance
      - name: 점검
        run: |
          cat > t.py <<'PY'
          import requests, time, json
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
                "Accept": "application/json, text/plain, */*"}
          r = requests.get("https://api.nasdaq.com/api/screener/stocks?tableonly=true&download=true", headers=UA, timeout=60)
          print("nasdaq screener", r.status_code, len(r.content))
          try:
              rows = r.json()["data"]["rows"]; print(" rows", len(rows), rows[0])
          except Exception as e: print(" parse fail", e, r.text[:200])
          types = ",".join(p + t for p in ("annual", "quarterly") for t in
                  ("OperatingIncome", "NetIncomeCommonStockholders", "NetIncome", "TotalAssets", "CurrentAssets", "CurrentLiabilities",
                   "TotalLiabilitiesNetMinorityInterest", "StockholdersEquity", "OperatingCashFlow", "CapitalExpenditure", "OrdinarySharesNumber"))
          u = f"https://query2.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/AAPL?symbol=AAPL&type={types}&period1=1420070400&period2={int(time.time())}"
          r = requests.get(u, headers=UA, timeout=60)
          print("yahoo timeseries direct", r.status_code, len(r.content))
          try:
              res = r.json()["timeseries"]["result"]
              for x in res:
                  k = x["meta"]["type"][0]; v = x.get(k) or []
                  print(" ", k, len(v), [ (y["asOfDate"], y["reportedValue"]["raw"]) for y in v if y][:2], "...", [y["asOfDate"] for y in v if y][-1:] )
          except Exception as e: print(" parse fail", e, r.text[:300])
          import yfinance as yf
          t = yf.Ticker("AAPL")
          for nm in ("quarterly_income_stmt", "income_stmt", "quarterly_cashflow", "quarterly_balance_sheet"):
              try:
                  df = getattr(t, nm); print("yf", nm, df.shape, list(df.columns[:1]), list(df.columns[-1:]))
              except Exception as e: print("yf", nm, "fail", e)
          # yfinance 내부 세션으로 timeseries (crumb 포함)
          try:
              from yfinance.data import YfData
              yd = YfData(); r = yd.get(u.replace("AAPL?","MSFT?").replace("symbol=AAPL","symbol=MSFT"))
              print("yf session timeseries", r.status_code, len(r.content))
          except Exception as e: print("yf session fail", e)
          d = yf.download(["AAPL", "MSFT", "^GSPC"], period="5d", progress=False, group_by="ticker")
          print("yfinance prices:", d.shape)
          PY
          python t.py 2>&1 | tee net.log
      - name: 결과 저장
        if: always()
        run: |
          mkdir out && cp net.log out/ || true
          cd out && git init -q -b net-test && git config user.name gh && git config user.email gh@users.noreply.github.com
          git add -A && git commit -q -m t && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" net-test
